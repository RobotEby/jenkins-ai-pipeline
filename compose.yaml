name: jenkins-ai-pipeline

services:
  jenkins:
    build: ./jenkins
    ports:
      - '127.0.0.1:8080:8080'
    group_add:
      - '${DOCKER_GID:-0}'
    environment:
      JAVA_OPTS: -Xms256m -Xmx1024m
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:1.5b}
      APP_PORT: ${APP_PORT:-3000}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-jenkins-ai-pipeline}
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  ollama:
    image: ollama/ollama@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_CONTEXT_LENGTH: '8192'
      OLLAMA_NO_CLOUD: '1'
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  app:
    profiles: [app]
    image: ${APP_IMAGE:-jenkins-ai-pipeline:local}
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:1.5b}
    init: true
    restart: unless-stopped

volumes:
  jenkins-data:
  ollama-data:
